<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product list with cart</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap');
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/fonts.css">

  <script src="./js/desserts-grid-creator.js" defer></script>
  <script src="./js/cart-behaviour.js" defer></script>

</head>
<body>

  <main>
    <section>

      <h1>Desserts</h1>
      <div id="desserts"></div>

    </section>

    <section id="cart">  

      <h6 id="cart-count">Your Cart (0)</h6>
      <img id="empty-cart-image" alt="" src="./assets/images/illustration-empty-cart.svg">

      <p id="empty-cart-text">Your added items will appear here</p>

    </section>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Léa Pouthier</a>.
  </footer>

</body>
</html>
